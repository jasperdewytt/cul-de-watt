# Report and site story tables (added 17 October 2026). src/comergy/story.py reads the
# committed exports named here and writes results/story/. It runs no model and changes no
# frozen result; every number the report and site cite traces through these tables.

[story]
headline_game = "best_causal_rule" # Game E of the causal game: each group's outside option is its cheapest of five forecast-free rules, the strongest matched test (results/causal_game/).
headline_split = "nucleolus" # The adopted settlement: the even stable split, which makes the smallest gain any group gets from staying as large as possible (every group keeps at least the least-core slack); it uses no income data. Chosen 17 Oct 2026 after review: it gives Member 5 the same result as the need split and a margin to every group.
alternative_split = "need_inverse_income_vs_causal_singletons" # Documented alternative: inverse-income weights projected onto the same game's core; a higher floor for the worst-off household but several groups left at zero slack.
equal_split = "equal_gains_vs_causal_singletons" # Site toggle comparator: equal gains over each household's best go-alone option (not stable).
before_scenario = "independent_rule" # "Before": every home runs its own equipment with the simple self-consumption rule (Stage 02).
after_scenario = "sharing_rule" # "After": the adopted simple sharing rule (Stage 02).
summer_month = 1 # Day-in-the-life summer day: the January weekday whose community solar is closest to the January weekday median.
winter_month = 7 # Day-in-the-life winter day: the same rule in July.
hourly_source = "tmp/stage02-day/sharing_rule/community_hourly.csv" # Regenerated by `comergy --stage02 --output tmp/stage02-day`; hourly files are not committed, the day extract is.
independent_hourly_source = "tmp/stage02-day/independent_rule/community_hourly.csv" # Same run, independent rule, for the day's grid-import comparison.
