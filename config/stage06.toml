# Stage 06 robustness and attribution contract, predeclared 24 September 2026
# before any Stage 06 case was run.  The Stage 02 physical contract, the
# simple sharing rule, the Stage 04 settlement family and the Stage 05
# information contract are frozen in their own files (hashes checked at run
# time).  This file only adds perturbations, new capabilities and experiments.

[stage06]
frozen_physical_config = "config/base.toml" # Frozen Stage 02 contract; never edited.
frozen_settlement_config = "config/stage04.toml" # Frozen Stage 04 settlement family.
frozen_operation_config = "config/stage05.toml" # Frozen Stage 05 information contract.
stage02_results = "results/stage02" # Preserved; read only.
stage04_results = "results/stage04" # Preserved; read only.
stage05_results = "results/stage05" # Preserved; read only.
cache_dir = "tmp/stage06/cache" # Ignored solve cache; entries are untrusted until revalidated.
hourly_dir = "tmp/stage06/hourly" # Ignored compact hourly flows for independent verification.
game_workers = 8 # Host budget: 10 physical cores, 48 GB; small coalition LPs in parallel.
heavy_workers = 4 # Full-year hourly oracles and rolling controllers (several GB each).
game_reconciliation_tolerance_aud = 1.0e-3 # Same as Stage 04 oracle reconciliation allowance.
money_tolerance_aud = 1.0e-6 # Export read-back and recomputation tolerance.
coalition_tolerance_aud = 1.0e-5 # Same as Stage 04 coalition excess reporting tolerance.
principal_need_mode = "inverse_income" # Stage 05 principal illustration (frozen).
principal_need_lambda = 1.0 # Stage 05 principal illustration (frozen).

[stage06.fees]
community_connection_aud_per_day = 1.0 # New F2: workbook Q4 "1" read as one connection per coalition (single-gate reading).

[stage06.capabilities]
initial_soc_prefix_price_aud_per_kwh = 0.0 # Initial inventory is created in explicit uncharged prefix hours, reported as grid-origin.
cyclic_max_iterations = 50 # Rule fixed-point iterations for the cyclic terminal rule.
cyclic_tolerance_kwh = 1.0e-9 # Rule fixed-point convergence on every battery.

[stage06.peak]
community_import_caps_kw = [40.0, 35.0, 30.0, 27.385, 25.0, 22.5, 20.0, 17.5, 15.0] # Declared grid; 27.385 is sharing's Stage 02 peak.
causal_cap_kw = 25.0 # Labelled causal experiment: a hard cap 2.4 kW below sharing's peak.
min_cap_margin_kw = 0.01 # Added before any run: minimum-peak cap is solved 0.01 kW above the LP minimum for numerical robustness.
connection_limit_kw = 5.0 # base.toml [sensitivities] capacity_model "5_kw_per_household".

[stage06.forecast]
noise_sigmas = [0.10, 0.25, 0.50, 1.00] # Multiplicative Gaussian error on revealed future demand and PV (offset >= 1 h).
noise_seed = 20261001 # Fixed before running; one stream per decision hour.
guarded_reruns = ["FC3", "G2"] # Added 24 Sep after FC3/G2 failed the frozen validator (one hour each of owner-to-owner battery transfer).

[stage06.communication]
# Coordination loss: listed hours run the household-local rule on actual SOC;
# sharing resumes at the next hour.  Start indices count hours from row 3.
outages = [
    { id = "L0", start_index = 6000, duration_hours = 3, label = "Stage 05 event 2 hours on sharing" },
    { id = "L1", start_index = 336, duration_hours = 24, label = "1 day from 15 Jan" },
    { id = "L2", start_index = 4680, duration_hours = 24, label = "1 day from 15 Jul" },
    { id = "L3", start_index = 264, duration_hours = 168, label = "7 days from 12 Jan" },
    { id = "L4", start_index = 4632, duration_hours = 168, label = "7 days from 13 Jul" },
    { id = "L5", start_index = 0, duration_hours = 744, label = "January" },
    { id = "L6", start_index = 4344, duration_hours = 744, label = "July" },
    { id = "L8", start_index = 0, duration_hours = 8760, label = "Whole year (control: must equal the independent rule)" },
]
random_day_fraction = 0.10 # L7: 36 whole days drawn without replacement.
random_seed = 20261002 # Fixed before running.

[stage06.ablation]
anchors = ["strong", "rule"] # Stage 04 strong-anchored targets plus rule-anchored targets declared here.
adverse_increase_cases = 2 # Rerun on the two cases that most increase sharing's strong funding shortfall.
adverse_decrease_cases = 1 # and the one that most decreases it, if any case decreases it.

# Predeclared experiment ledger.  plan_item keys: tariff_unit, fee, pv,
# battery, forecast, exit, communication, peak, ablation, replication.
# game: full (all 511 coalitions re-solved), arithmetic (exact transform of
# the base primary costs), restricted (subset of the base game), unchanged
# (outside options unaffected), none.
[[ledger]]
id = "R0"
plan_item = "replication"
question = "Does the Stage 06 path reproduce Stage 02 rules and all 511 Stage 04 coalition costs?"
changes = "none"
overturns = "Any Stage 06 number that silently drifts from the frozen Stage 02/04/05 results"
scenarios = "independent rule, sharing rule, base game recomputed"
game = "full"

[[ledger]]
id = "T1"
plan_item = "tariff_unit"
sensitivity_key = "tariff_to_aud"
question = "If J/K are literally c/kWh, does sharing still beat independent operation and does the settlement picture hold?"
changes = "billing.tariff_to_aud 1.0 -> 0.01 (peak-hour mask kept on raw 0.55)"
overturns = "C1 sharing saves vs independent rule; C3 strong shortfall; C4 singleton feasibility; C5 Member 5 gains"
scenarios = "independent rule, sharing rule, full game"
game = "full"

[[ledger]]
id = "T2"
plan_item = "tariff_unit"
combination = ["tariff_to_aud", "wear_aud_per_discharge_kwh"]
question = "Labelled combination: does any T1 reversal come from the AUD wear rate rather than the unit itself?"
changes = "tariff_to_aud 0.01 and wear 0.0"
overturns = "Attribution of a T1 reversal to the tariff unit"
scenarios = "independent rule, sharing rule, full game"
game = "full"

[[ledger]]
id = "F1"
plan_item = "fee"
sensitivity_key = "daily_connection_aud"
question = "If the $1/day fee is for the whole community (split per household), do the conclusions change?"
changes = "billing.daily_connection_aud 1.0 -> 1/9 per household"
overturns = "C1, C3, C4, C5 and percentage savings"
scenarios = "independent rule, sharing rule (fees are additive, dispatch unchanged)"
game = "arithmetic"

[[ledger]]
id = "F2"
plan_item = "fee"
question = "If a coalition pays one connection regardless of size (single-gate reading), is strong subgroup protection fundable?"
